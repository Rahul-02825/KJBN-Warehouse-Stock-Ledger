name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ledger_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/ledger_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.31.1"

      - name: Install golang-migrate
        run: |
          curl -sSL https://github.com/golang-migrate/migrate/releases/download/v4.18.1/migrate.linux-amd64.tar.gz | tar xz
          sudo mv migrate /usr/local/bin/migrate

      - name: Schema snapshot is current
        run: make check-schema

      - name: Generated sqlc code is current
        run: sqlc diff

      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Migrate test database
        run: migrate -path db/migrations -database "$TEST_DATABASE_URL" up

      - name: Test
        run: go test -race -v -coverpkg=./internal/domain/...,./internal/ledger/...,./internal/httpapi/... -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Load test against a running server
        run: |
          DATABASE_URL="$TEST_DATABASE_URL" PORT=8080 go run ./cmd/api > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8080/healthz && break; sleep 1; done
          go run ./cmd/loadtest -url http://localhost:8080 || (cat api.log && exit 1)
