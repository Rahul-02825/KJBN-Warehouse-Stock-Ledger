openapi: 3.0.3
info:
  title: Warehouse Stock Ledger API
  version: 1.0.0
  description: |
    Every stock change is an immutable movement with ledger entries. Balances are a
    cache of the ledger. Decimals are returned as strings; requests accept strings or numbers.
    Errors use `{"error": {"code", "message", "fields"?, "details"?}}`.
servers:
  - url: /
tags:
  - name: Products
    description: Catalogue items with unit, reorder level and current weighted-average cost.
  - name: Locations
    description: Warehouse bins with position, capacity and what they hold.
  - name: Warehouses
    description: Warehouse layout, capacity, and bin placement and pick previews.
  - name: Inventory
    description: Current stock from the balance cache, and stock rebuilt from the ledger at a past date.
  - name: Movements
    description: Post IN, OUT, TRANSFER, ADJUSTMENT, REVERSAL and stock takes; browse history.
  - name: Reports
    description: Low stock, valuation, reconciliation, cost check, activity, top movers, season forecast and product ledger.
  - name: Health
    description: Liveness and database connectivity.

paths:
  /api/products:
    post:
      tags: [Products]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductCreate' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '409': { description: SKU already exists (DUPLICATE), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [Products]
      summary: List products
      parameters:
        - { name: search, in: query, schema: { type: string }, description: Matches SKU or name }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of products
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Product' } }
                  page: { type: integer }
                  page_size: { type: integer }
                  total: { type: integer }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/products/{id}:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    get:
      tags: [Products]
      summary: Get a product
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [Products]
      summary: Update name and/or reorder level (SKU and unit cannot change)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                reorder_level: { $ref: '#/components/schemas/Decimal' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/products/{id}/balances:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    get:
      tags: [Inventory]
      summary: Stock of one product in every bin, with the total
      responses:
        '200': { $ref: '#/components/responses/Object' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/products/{id}/ledger:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    get:
      tags: [Reports]
      summary: Every ledger entry for a product with running balances
      parameters: [ { $ref: '#/components/parameters/Format' } ]
      responses:
        '200': { $ref: '#/components/responses/ObjectOrCSV' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/locations:
    post:
      tags: [Locations]
      summary: Create a bin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, example: A-01, description: 'Unique, no spaces, max 64' }
                description: { type: string, maxLength: 500 }
                warehouse_id: { type: integer, description: Defaults to the first warehouse }
                x: { type: number, description: Metres; must be within the warehouse perimeter }
                y: { type: number }
                capacity: { type: integer, minimum: 1, nullable: true, description: 'Items (pcs) the bin holds; empty means no limit; at most the warehouse capacity' }
                auto_place: { type: boolean, default: true, description: Whether automatic placement may use this bin }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Location' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [Locations]
      summary: List bins
      responses:
        '200':
          description: All bins
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Location' } }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/warehouses:
    get:
      tags: [Warehouses]
      summary: Warehouses with perimeter, capacity and pcs in use
      responses:
        '200': { $ref: '#/components/responses/Object' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/placements/preview:
    post:
      tags: [Warehouses]
      summary: Show where a pcs receipt would be placed, without posting
      description: |
        Fills the starting bin, then the nearest bins with space (straight-line distance
        from the starting bin). Without location_id the start is the bin holding the most
        of the product, else the bin nearest the warehouse receiving point.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id, quantity]
              properties:
                product_id: { type: integer }
                quantity: { type: string, example: '30' }
                location_id: { type: integer }
                warehouse_id: { type: integer }
      responses:
        '200': { $ref: '#/components/responses/Object' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: NO_SPACE with fit and requested details, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/picks/preview:
    post:
      tags: [Warehouses]
      summary: Show which bins a shipment would be picked from, without posting
      description: |
        Takes from the starting bin, then the nearest bins that hold the product. Without
        location_id the start is the bin holding the most of the product.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id, quantity]
              properties:
                product_id: { type: integer }
                quantity: { type: string, example: '120' }
                location_id: { type: integer }
                warehouse_id: { type: integer }
      responses:
        '200': { $ref: '#/components/responses/Object' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: INSUFFICIENT_STOCK with available and requested details, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/locations/{id}:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    get:
      tags: [Locations]
      summary: Get a bin
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Location' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/locations/{id}/balances:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    get:
      tags: [Inventory]
      summary: Products stored in one bin
      responses:
        '200': { $ref: '#/components/responses/Object' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/inventory:
    get:
      tags: [Inventory]
      summary: Stock grid, every product x every bin
      responses:
        '200': { $ref: '#/components/responses/Object' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/inventory/as-of:
    get:
      tags: [Inventory]
      summary: Stock at a past moment, rebuilt from the ledger
      parameters:
        - { name: date, in: query, required: true, schema: { type: string }, description: '2026-10-01 (end of that day, IST) or an RFC 3339 time' }
        - { name: product_id, in: query, schema: { type: integer } }
        - { name: location_id, in: query, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/Object' }
        '400': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/inventory/{productId}/{locationId}:
    parameters:
      - { name: productId, in: path, required: true, schema: { type: integer } }
      - { name: locationId, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Inventory]
      summary: Stock of one product in one bin
      responses:
        '200': { $ref: '#/components/responses/Object' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/movements/in:
    post:
      tags: [Movements]
      summary: Receive stock (updates the weighted-average cost; pcs are placed across bins by capacity)
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id, quantity, unit_cost, created_by]
              properties:
                product_id: { type: integer }
                location_id: { type: integer, description: 'Starting bin; optional for pcs (chosen automatically), required for kg and litre' }
                warehouse_id: { type: integer, description: Used when no location_id is given }
                quantity: { $ref: '#/components/schemas/Decimal' }
                unit_cost: { $ref: '#/components/schemas/Decimal' }
                reference: { type: string, example: INV-1001 }
                created_by: { type: string }
      responses: &posting
        '201': { description: Posted, content: { application/json: { schema: { $ref: '#/components/schemas/Movement' } } } }
        '200': { description: Replayed by Idempotency-Key, content: { application/json: { schema: { $ref: '#/components/schemas/Movement' } } } }
        '400': { description: 'VALIDATION_ERROR, BAD_REQUEST or OUT_OF_RANGE', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 'Product, location or movement not found', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'INSUFFICIENT_STOCK, NO_SPACE, ALREADY_REVERSED, NOT_REVERSIBLE or IDEMPOTENCY_KEY_REUSED', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/movements/out:
    post:
      tags: [Movements]
      summary: Ship stock (picked from several bins if needed; valued at the current average, frozen on the movement)
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id, quantity, created_by]
              properties:
                product_id: { type: integer }
                location_id: { type: integer, description: 'Bin to pick from first; the rest comes from the nearest bins holding the product' }
                warehouse_id: { type: integer, description: Used when no location_id is given }
                quantity: { $ref: '#/components/schemas/Decimal' }
                reference: { type: string }
                created_by: { type: string }
      responses: *posting

  /api/movements/transfer:
    post:
      tags: [Movements]
      summary: Move stock between two bins (one movement, two entries)
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id, from_location_id, to_location_id, quantity, created_by]
              properties:
                product_id: { type: integer }
                from_location_id: { type: integer }
                to_location_id: { type: integer }
                quantity: { $ref: '#/components/schemas/Decimal' }
                reference: { type: string }
                created_by: { type: string }
      responses: *posting

  /api/movements/adjustment:
    post:
      tags: [Movements]
      summary: Correct stock after a count or incident (signed quantity)
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id, location_id, quantity, reason, created_by]
              properties:
                product_id: { type: integer }
                location_id: { type: integer }
                quantity: { $ref: '#/components/schemas/Decimal' }
                reason: { type: string, enum: [damaged, expired, count_correction, theft, other] }
                note: { type: string, description: Required when reason is other }
                reference: { type: string }
                created_by: { type: string }
      responses: *posting

  /api/movements/{id}/reverse:
    parameters:
      - { $ref: '#/components/parameters/ID' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      tags: [Movements]
      summary: Post the inverse of a movement (the original is never changed)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [created_by]
              properties:
                note: { type: string }
                created_by: { type: string }
      responses: *posting

  /api/stock-takes:
    post:
      tags: [Movements]
      summary: Count a bin and post a count-correction adjustment for every difference
      description: |
        Each line's difference is worked out from the current balance, so posting the same
        count twice changes nothing the second time. All lines succeed or none do.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [location_id, counts, created_by]
              properties:
                location_id: { type: integer }
                counts:
                  type: array
                  maxItems: 500
                  items:
                    type: object
                    required: [product_id, counted]
                    properties:
                      product_id: { type: integer }
                      counted: { $ref: '#/components/schemas/Decimal' }
                note: { type: string }
                reference: { type: string, description: Defaults to Stock take }
                created_by: { type: string }
      responses:
        '201': { $ref: '#/components/responses/Object' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: NO_SPACE when a counted increase does not fit, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/movements:
    get:
      tags: [Movements]
      summary: Movement history with filters
      parameters:
        - { name: product_id, in: query, schema: { type: integer } }
        - { name: location_id, in: query, schema: { type: integer } }
        - { name: type, in: query, schema: { type: string, enum: [IN, OUT, TRANSFER, ADJUSTMENT, REVERSAL] } }
        - { name: reference, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string }, description: Date (IST) or RFC 3339 }
        - { name: to, in: query, schema: { type: string }, description: 'Date (inclusive, IST) or RFC 3339' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: One page of movements, or a CSV file of all matches with format=csv
          content:
            application/json: { schema: { type: object } }
            text/csv: { schema: { type: string } }
        '400': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/movements/{id}:
    parameters: [ { $ref: '#/components/parameters/ID' } ]
    get:
      tags: [Movements]
      summary: One movement with its ledger entries
      responses:
        '200': { $ref: '#/components/responses/Object' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/reports/low-stock:
    get:
      tags: [Reports]
      summary: Products at or below their reorder level
      parameters: [ { $ref: '#/components/parameters/Format' } ]
      responses:
        '200': { $ref: '#/components/responses/ObjectOrCSV' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/reports/valuation:
    get:
      tags: [Reports]
      summary: Quantity x average cost per product, with the grand total
      parameters: [ { $ref: '#/components/parameters/Format' } ]
      responses:
        '200': { $ref: '#/components/responses/ObjectOrCSV' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/reports/reconciliation:
    get:
      tags: [Reports]
      summary: Compare cached balances with ledger totals (read-only)
      parameters:
        - { name: only_drift, in: query, schema: { type: boolean } }
      responses:
        '200': { $ref: '#/components/responses/Object' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/reports/cost-check:
    get:
      tags: [Reports]
      summary: Replay the ledger and compare each product's average cost (read-only)
      responses:
        '200': { $ref: '#/components/responses/Object' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/reports/daily-activity:
    get:
      tags: [Reports]
      summary: Postings and values per day (IST), for charts
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 365, default: 30 } }
      responses:
        '200': { $ref: '#/components/responses/Object' }
        '400': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/reports/top-movers:
    get:
      tags: [Reports]
      summary: Products ranked by value shipped (reversed shipments excluded)
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 365, default: 30 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 5 } }
      responses:
        '200': { $ref: '#/components/responses/Object' }
        '400': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/reports/season-forecast:
    get:
      tags: [Reports]
      summary: Products with less stock than was shipped in the same window last year
      description: |
        Compares current stock with OUT quantities (reversed ones excluded) from the
        same `days` window one year ago. Only products short of last year's demand are
        listed, largest gap value (gap x average cost) first.
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 180, default: 30 } }
      responses:
        '200': { $ref: '#/components/responses/Object' }
        '400': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  /healthz:
    get:
      tags: [Health]
      summary: 200 when the database answers, 503 otherwise
      responses:
        '200': { description: ok }
        '503': { description: unavailable }

components:
  parameters:
    ID: { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    Page: { name: page, in: query, schema: { type: integer, default: 1 } }
    PageSize: { name: page_size, in: query, schema: { type: integer, default: 20, maximum: 100 } }
    Format: { name: format, in: query, schema: { type: string, enum: [csv] }, description: Download as CSV }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema: { type: string, maxLength: 128 }
      description: |
        Optional. Retrying with the same key returns the first movement (200 with
        header Idempotent-Replayed: true) instead of posting again. Reusing a key for
        a different request returns 409 IDEMPOTENCY_KEY_REUSED.

  responses:
    Error:
      description: Error
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    InternalError:
      description: Unexpected server error; the cause is logged, not returned
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Object:
      description: OK
      content: { application/json: { schema: { type: object } } }
    ObjectOrCSV:
      description: OK (JSON, or CSV with format=csv)
      content:
        application/json: { schema: { type: object } }
        text/csv: { schema: { type: string } }

  schemas:
    Decimal:
      type: string
      example: '12.5'
      description: Up to 4 decimal places; whole numbers only for pcs
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum: [BAD_REQUEST, VALIDATION_ERROR, OUT_OF_RANGE, NOT_FOUND, DUPLICATE, INSUFFICIENT_STOCK, NO_SPACE, ALREADY_REVERSED, NOT_REVERSIBLE, IDEMPOTENCY_KEY_REUSED, INTERNAL]
              description: |
                - `BAD_REQUEST`: 400, malformed JSON or a bad id in the path
                - `VALIDATION_ERROR`: 400, one message per invalid field in `fields`
                - `OUT_OF_RANGE`: 400, a resulting quantity or value is too large to store
                - `NOT_FOUND`: 404, the product, location, warehouse or movement does not exist
                - `DUPLICATE`: 409, the SKU or bin code is already taken
                - `INSUFFICIENT_STOCK`: 409, not enough stock; `details` has available and requested
                - `NO_SPACE`: 409, the bin or warehouse cannot hold it; `details` has fit and requested
                - `ALREADY_REVERSED`: 409, the movement has already been reversed
                - `NOT_REVERSIBLE`: 409, a reversal, or a receipt whose stock was already used
                - `IDEMPOTENCY_KEY_REUSED`: 409, the Idempotency-Key was used for a different request
                - `INTERNAL`: 500, unexpected failure; details are logged, never returned
            message: { type: string }
            fields: { type: object, additionalProperties: { type: string } }
            details: { type: object, additionalProperties: { type: string } }
    ProductCreate:
      type: object
      required: [sku, name, unit]
      properties:
        sku: { type: string, example: RICE-25 }
        name: { type: string }
        unit: { type: string, enum: [pcs, kg, litre] }
        reorder_level: { $ref: '#/components/schemas/Decimal' }
    Product:
      type: object
      properties:
        id: { type: integer }
        sku: { type: string }
        name: { type: string }
        unit: { type: string }
        reorder_level: { $ref: '#/components/schemas/Decimal' }
        average_cost: { $ref: '#/components/schemas/Decimal' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Location:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        description: { type: string }
        warehouse_id: { type: integer }
        x: { type: number }
        y: { type: number }
        capacity: { type: integer, nullable: true }
        auto_place: { type: boolean }
        used: { type: integer, description: Items (pcs) stored; list endpoint only }
        created_at: { type: string, format: date-time }
    Movement:
      type: object
      properties:
        id: { type: integer }
        type: { type: string, enum: [IN, OUT, TRANSFER, ADJUSTMENT, REVERSAL] }
        product_id: { type: integer }
        from_location_id: { type: integer, nullable: true }
        to_location_id: { type: integer, nullable: true }
        quantity: { $ref: '#/components/schemas/Decimal' }
        unit_cost: { type: string, nullable: true }
        total_value: { type: string, nullable: true }
        reference: { type: string }
        reason: { type: string, nullable: true }
        note: { type: string }
        created_by: { type: string }
