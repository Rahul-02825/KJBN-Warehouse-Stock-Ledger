services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 2s
      retries: 30

  migrate:
    image: migrate/migrate:v4.18.1
    volumes:
      - ./backend/db/migrations:/migrations:ro
    command: ["-path", "/migrations", "-database", "${DATABASE_URL:-postgres://ledger:ledger@db:5432/ledger?sslmode=disable}", "up"]
    depends_on:
      db:
        condition: service_healthy

  seed:
    build: ./backend
    image: stock-ledger-backend
    command: ["seed"]
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgres://ledger:ledger@db:5432/ledger?sslmode=disable}"
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build: ./backend
    image: stock-ledger-backend
    command: ["api"]
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgres://ledger:ledger@db:5432/ledger?sslmode=disable}"
      PORT: "8080"
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 2s
      retries: 30
    depends_on:
      seed:
        condition: service_completed_successfully

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
